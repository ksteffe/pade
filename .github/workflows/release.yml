name: Release

# Milestone I: explicit, manual releases only. Never runs on merge to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-release checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate version input
        run: |
          v="${{ inputs.version }}"
          case "$v" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "error: version must look like v0.1.0 (got: $v)" >&2; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Unit checks
        run: make ci-unit

      - name: Smoke checks
        run: make ci-smoke

      - name: Container smoke
        run: make ci-container

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set release metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build CLI release artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export COMMIT="${{ steps.meta.outputs.commit }}"
          export BUILD_TIME="${{ steps.meta.outputs.build_time }}"
          make release-artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7e8933966f762eea29795d3c4c4199a599b8098 # v3

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9faf3aa096ae2630888e7c1d # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pade-broker image
        id: broker-image
        uses: docker/build-push-action@0565240e2d4abfbbbd75806656b683e1c2482fc5 # v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ksteffe/pade-broker:${{ inputs.version }}
            ghcr.io/ksteffe/pade-broker:latest
          build-args: |
            VERSION=${{ inputs.version }}
            VCS_REF=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Write image digest artifact
        run: |
          mkdir -p dist/${{ inputs.version }}
          echo "${{ steps.broker-image.outputs.digest }}" > "dist/${{ inputs.version }}/pade-broker-image.digest"
          {
            echo "pade-broker ${{ inputs.version }} ${{ steps.broker-image.outputs.digest }}"
            echo "commit ${{ steps.meta.outputs.commit }}"
          } > "dist/${{ inputs.version }}/release-manifest.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a6da7744555790f25c1d0e0b5b4b176ed6e039e8 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/${{ inputs.version }}/*
