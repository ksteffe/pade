name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal spec)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go build -o bin/pade ./cmd/pade
          go build -o bin/pade-broker ./cmd/pade-broker

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -o bin/pade ./cmd/pade
          go build -o bin/pade-broker ./cmd/pade-broker

      - name: Validate examples and env dogfood
        run: |
          ./bin/pade validate -f spec/examples/web-app.yaml
          ./bin/pade plan -f spec/examples/web-app.yaml --json > /tmp/pade-plan.json
          ./bin/pade capabilities -f spec/examples/web-app.yaml --bindings spec/examples/bindings.example.yaml --json > /tmp/pade-capabilities.json

          GA_PROPERTY_ID=demo-property \
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/fake-ga.json \
          ./bin/pade exec \
            -f spec/examples/web-app.yaml \
            --bindings spec/examples/bindings.example.yaml \
            --capability google-analytics.read \
            -- /bin/sh -c 'test -n "$GA_PROPERTY_ID" && test -n "$GOOGLE_APPLICATION_CREDENTIALS" && printf exec-ok'

          chmod +x examples/demo-project/scripts/github-whoami
          ./bin/pade validate -f examples/demo-project/pade.yaml
          ./bin/pade plan -f examples/demo-project/pade.yaml --bindings examples/demo-project/bindings.example.yaml --json > /tmp/pade-demo-plan.json
          GITHUB_TOKEN=pade-demo-env-token \
          ./bin/pade exec \
            -f examples/demo-project/pade.yaml \
            --bindings examples/demo-project/bindings.example.yaml \
            --capability github.user.read \
            -- ./scripts/github-whoami

          # Milestone 5: same pade.yaml, Alice/Bob bindings, distinct material.
          chmod +x scripts/identity-dogfood.sh
          PADE="$(pwd)/bin/pade" ./scripts/identity-dogfood.sh

          mkdir -p /tmp/pade-orch/.devcontainer
          printf '{}\n' > /tmp/pade-orch/.devcontainer/devcontainer.json
          cp spec/examples/web-app-orchestrated.yaml /tmp/pade-orch/pade.yaml
          ./bin/pade validate -f /tmp/pade-orch/pade.yaml
          ./bin/pade plan -f /tmp/pade-orch/pade.yaml --json > /tmp/pade-orch-plan.json

      - name: Vault dogfood
        run: |
          chmod +x scripts/vault-dogfood.sh
          PADE="$(pwd)/bin/pade" ./scripts/vault-dogfood.sh

      - name: 1Password dogfood
        run: |
          chmod +x scripts/onepassword-dogfood.sh scripts/fake-op.sh
          PADE="$(pwd)/bin/pade" ./scripts/onepassword-dogfood.sh

      - name: Keeper dogfood
        run: |
          chmod +x scripts/keeper-dogfood.sh scripts/fake-keeper.sh
          PADE="$(pwd)/bin/pade" ./scripts/keeper-dogfood.sh

      - name: Keeper Secrets Manager dogfood
        run: |
          chmod +x scripts/ksm-dogfood.sh examples/demo-project/scripts/github-whoami
          PADE="$(pwd)/bin/pade" ./scripts/ksm-dogfood.sh

      - name: Broker OIDC dogfood
        run: |
          chmod +x scripts/broker-dogfood.sh
          go build -o bin/pade-broker ./cmd/pade-broker
          PADE="$(pwd)/bin/pade" ./scripts/broker-dogfood.sh
