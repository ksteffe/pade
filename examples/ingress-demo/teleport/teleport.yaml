# Local-only Teleport Community Edition config for PADE Milestone 8 dogfood (host process).
# Self-signed Proxy TLS; local users use OTP MFA — not production-safe.
# App URI targets the demo on the host loopback. See teleport.compose.yaml for Docker Compose.
version: v3
teleport:
  nodename: localhost
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: "yes"
  listen_addr: 127.0.0.1:3025
  cluster_name: pade-local
  proxy_listener_mode: multiplex
  authentication:
    type: local
    # Community Edition requires MFA; OTP avoids WebAuthn rp_id setup for laptop dogfood.
    second_factor: otp

ssh_service:
  enabled: "no"

proxy_service:
  enabled: "yes"
  web_listen_addr: 0.0.0.0:3080
  public_addr: "localhost:3080"
  https_keypairs: []
  acme: {}

app_service:
  enabled: "yes"
  apps:
    - name: pade-ingress-demo
      description: "PADE Milestone 8 local ingress demo"
      uri: "http://127.0.0.1:8080"
      labels:
        env: pade-dogfood
