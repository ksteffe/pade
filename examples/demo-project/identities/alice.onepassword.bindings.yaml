# Simulated developer Alice — 1Password bindings (Milestone 6).
# Same capability name as the shared pade.yaml; Alice-specific op:// refs.
version: "0.1"

capabilities:
  google-analytics.read:
    provider: onepassword
    onepassword:
      refs:
        GA_PROPERTY_ID: "op://pade-demo/developers/alice/google-analytics/property_id"
        GOOGLE_APPLICATION_CREDENTIALS: "op://pade-demo/developers/alice/google-analytics/credentials_path"
