# Simulated developer Bob — 1Password bindings (Milestone 6).
# Same capability name as the shared pade.yaml; Bob-specific op:// refs.
version: "0.1"

capabilities:
  google-analytics.read:
    provider: onepassword
    onepassword:
      refs:
        GA_PROPERTY_ID: "op://pade-demo/developers/bob/google-analytics/property_id"
        GOOGLE_APPLICATION_CREDENTIALS: "op://pade-demo/developers/bob/google-analytics/credentials_path"
