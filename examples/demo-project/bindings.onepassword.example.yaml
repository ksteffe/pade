# Local 1Password bindings for the demo-project (Milestone 6).
# Same portable capability names as pade.yaml — 1Password is a binding, not part of the manifest.
# Requires the 1Password CLI (`op`) or PADE_OP_BIN (see docs/onepassword-dogfood.md).
version: "0.1"

capabilities:
  google-analytics.read:
    provider: onepassword
    onepassword:
      refs:
        GA_PROPERTY_ID: "op://pade-demo/google-analytics/property_id"
        GOOGLE_APPLICATION_CREDENTIALS: "op://pade-demo/google-analytics/credentials_path"
