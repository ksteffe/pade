# Example Keeper Secrets Manager capability bindings for the demo project.
# Bootstrap via ambient KSM_CONFIG (not stored in this file).
# For CI: PADE_KSM_FAKE=1 uses in-process stubs for pade-demo-* UIDs.
version: "0.1"

capabilities:
  github.user.read:
    provider: keeper-secrets-manager
    keeperSecretsManager:
      refs:
        GITHUB_TOKEN: "keeper://pade-demo-github/field/password"
