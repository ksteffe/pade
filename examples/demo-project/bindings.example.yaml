# Example local bindings for the demo-project.
# Copy to .pade/bindings.yaml (gitignored) or pass --bindings.
# Do not commit real credentials.
version: "0.1"

capabilities:
  google-analytics.read:
    provider: env
    env:
      - GA_PROPERTY_ID
      - GOOGLE_APPLICATION_CREDENTIALS

