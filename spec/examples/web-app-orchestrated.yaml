# Historical orchestration-oriented example, reduced to portable Intent.
# Earlier drafts also declared environment/services/lifecycle here; those are
# outside v1alpha1 DevelopmentSession.spec (Dev Containers / DevPod own env).
# Credentials must never appear in this file.
apiVersion: pade.local/v1alpha1
kind: DevelopmentSession
metadata:
  name: web-app-orchestrated
spec:
  capabilities:
    google-analytics.read:
      provider: env
      env:
        - GA_PROPERTY_ID
        - GOOGLE_APPLICATION_CREDENTIALS
