# Example Keeper Secrets Manager capability bindings.
# Copy pattern into .pade/bindings.yaml or pass --bindings.
# Do not commit real credentials or KSM_CONFIG.
#
# Bootstrap: ambient KSM_CONFIG (base64 device config) — never stored here.
# Ref format: Keeper Notation (bare keeper://UID expands to .../field/password).
version: "0.1"

capabilities:
  github.user.read:
    provider: keeper-secrets-manager
    keeperSecretsManager:
      refs:
        GITHUB_TOKEN: "keeper://YOUR_RECORD_UID/field/password"
