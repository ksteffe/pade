# Example local/broker bindings for provider: exec (draft external provider contract).
# See docs/provider-contract.md. Command paths are host-local — not portable Intent.
version: "0.1"

capabilities:
  demo.derived:
    provider: exec
    exec:
      command: ["./bin/pade-provider-stub"]
      config:
        tokenEnv: DEMO_TOKEN
        value: example-only-not-a-real-secret

  # GitHub App reference provider (examples/providers/github).
  # Fake CI: PADE_PROVIDER_FAKE=1. Real: set appId/installationId/privateKeyPath
  # or GITHUB_APP_* env on the broker host — never put the private key in Intent.
  # github.repo.read:
  #   provider: exec
  #   exec:
  #     command: ["./bin/pade-provider-github"]
  #     config:
  #       tokenEnv: GITHUB_TOKEN
  #       appId: "123456"
  #       installationId: "789012"
  #       privateKeyPath: "/run/secrets/github-app.pem"
  #       repositories: [ksteffe/pade]
  #       permissions:
  #         metadata: read
  #         contents: read
