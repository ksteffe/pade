# Example 1Password capability bindings. Copy pattern into .pade/bindings.yaml
# or pass --bindings. Do not commit real credentials.
version: "0.1"

capabilities:
  google-analytics.read:
    provider: onepassword
    onepassword:
      refs:
        GA_PROPERTY_ID: "op://Employee/GA Demo/property_id"
        GOOGLE_APPLICATION_CREDENTIALS: "op://Employee/GA Demo/credentials_path"
